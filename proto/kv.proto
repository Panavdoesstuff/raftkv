syntax = "proto3";
package raftkv.kv;
option go_package = "github.com/panavdoesstuff/raftkv/proto/kvpb";

enum Op {
  GET = 0;
  PUT = 1;
  APPEND = 2;
}

enum Err {
  OK = 0;
  ERR_WRONG_LEADER = 1;
  ERR_TIMEOUT = 2;
  ERR_NO_KEY = 3;
}

message CommandArgs {
  Op op = 1;
  string key = 2;
  string value = 3;
  string client_id = 4;
  uint64 seq = 5;
}
message CommandReply {
  Err err = 1;
  string value = 2;
  string leader_hint = 3;
}

message MembershipArgs {
  string id = 1;
  string addr = 2;
}
message MembershipReply {
  Err err = 1;
  string message = 2;
  string leader_hint = 3;
}

service KV {
  rpc Command(CommandArgs) returns (CommandReply);
  rpc AddServer(MembershipArgs) returns (MembershipReply);
  rpc RemoveServer(MembershipArgs) returns (MembershipReply);
}
